[project]
name = "verisure-ad-automation"
version = "0.1.0"
description = "Multi-platform ad automation platform for VeriSure."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[tool.uv]

dev-dependencies = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
